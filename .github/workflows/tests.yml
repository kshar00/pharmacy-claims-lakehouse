# Runs the local test suite on every push and pull request.
# No Databricks connection is needed: the tests cover the generator's helper functions and
# check that the job, notebooks, dashboard export and docs still agree with each other.
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: pytest -v tests
